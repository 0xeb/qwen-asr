name: CI Build

on:
  push:
    branches: [main, ci-*]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux ---
          - name: Linux x64
            os: ubuntu-24.04
            blas: ON
            apt: libopenblas-dev

          - name: Linux x64 (no BLAS)
            os: ubuntu-24.04
            blas: OFF

          - name: Linux arm64 (cross)
            os: ubuntu-24.04
            blas: OFF
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-aarch64-linux.cmake

          # --- macOS ---
          - name: macOS x64
            os: macos-13
            blas: ON

          - name: macOS arm64
            os: macos-14
            blas: ON

          # --- Windows (expected to fail — POSIX APIs) ---
          - name: Windows x64 (MSVC)
            os: windows-latest
            blas: OFF

          - name: Windows x64 (MinGW)
            os: windows-latest
            blas: OFF
            cmake_extra: -G "MinGW Makefiles"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.name, 'Windows') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (apt)
        if: runner.os == 'Linux' && matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        run: >
          cmake -B build
          -DQWEN_BLAS=${{ matrix.blas }}
          ${{ matrix.cmake_extra || '' }}

      - name: Build
        run: cmake --build build --verbose

      - name: Show binary info
        if: runner.os != 'Windows'
        run: file build/qwen_asr
